<!DOCTYPE html> <!-- Declara que este documento usa HTML5 -->
<html lang="es"> <!-- Etiqueta raíz; lang="es" indica que el contenido está en español -->

<head> <!-- Zona de metadatos: no se muestra en pantalla, configura el documento -->

    <meta charset="UTF-8"> <!-- Define la codificación de caracteres como UTF-8 para que acentos y símbolos se vean bien -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Hace la página responsive y fija el zoom inicial -->

    <title>Nexcent | Lecciones e insights</title> <!-- Texto que aparece en la pestaña del navegador -->

    <link rel="stylesheet" href="styleserch.css"> <!-- Conecta este HTML con el archivo de estilos styleserch.css -->
</head>

<body> <!-- Contenido visible de la página -->

    <section class="hero"> <!-- Sección principal (hero): franja superior con el mensaje destacado -->

        <div class="hero-container"> <!-- Contenedor que centra y limita el ancho del contenido del hero -->

            <div class="hero-text"> <!-- Columna izquierda: título, párrafo y botón -->

                <h1>
                    Lessons and insights <!-- Primera línea del título, en color oscuro (por defecto) -->
                    <span class="highlight">from 8 years</span> <!-- Segunda línea, resaltada en verde con la clase .highlight -->
                </h1>

                <p class="hero-subtitle">
                    Where to grow your business as a photographer: site or social media? <!-- Texto de apoyo debajo del título -->
                </p>

                <button class="btn-register">Register</button> <!-- Botón de llamada a la acción (call to action) en verde -->

                <div class="hero-dots"> <!-- Indicadores tipo carrusel (puntos) debajo del texto -->
                    <span class="dot active"></span> <!-- Punto activo (más oscuro/relleno) -->
                    <span class="dot"></span> <!-- Punto inactivo -->
                    <span class="dot"></span> <!-- Otro punto inactivo -->
                </div>
            </div>

            <div class="hero-image"> <!-- Columna derecha: ilustración -->
                <img src="img/HEROPC.svg" alt="Ilustración de una computadora con código y una persona junto a ella"> <!-- SVG en la carpeta img; alt describe la imagen para accesibilidad -->
            </div>
        </div>
    </section>

    <section class="clients"> <!-- Segunda sección: muestra los clientes de la empresa -->

        <div class="clients-container"> <!-- Contenedor centrado para el contenido de clientes -->

            <h2>Our Clients</h2> <!-- Título de la sección -->

            <p class="clients-subtitle">We have been working with some Fortune 500+ clients</p> <!-- Subtítulo descriptivo -->

            <div class="clients-logos"> <!-- Fila donde se alinean todos los logos -->

                <img src="img/Logo1.svg" alt="Logo de cliente 1" class="client-logo"> <!-- Logo 1 -->
                <img src="img/Logo2.svg" alt="Logo de cliente 2" class="client-logo"> <!-- Logo 2 -->
                <img src="img/Logo3.svg" alt="Logo de cliente 3" class="client-logo"> <!-- Logo 3 -->
                <img src="img/Logo4.svg" alt="Logo de cliente 4" class="client-logo"> <!-- Logo 4 -->
                <img src="img/Logo5.svg" alt="Logo de cliente 5" class="client-logo"> <!-- Logo 5 -->
                <img src="img/Logo6.svg" alt="Logo de cliente 6" class="client-logo"> <!-- Logo 6 -->
                <img src="img/Logo7.svg" alt="Logo de cliente 7" class="client-logo"> <!-- Logo 7 -->
            </div>
        </div>
    </section>

</body>
</html>
