<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footer</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <footer class="footer">
        <div class="footer-content">
            <div class="logo">
                <img src="images/logo nexcent.svg" alt="Logo">
            <h6>Copyright © 2020 Nexcent ltd. <br> All rights reserved.</h6>
            <label class="social-media">
                <a href="https://www.instagram.com" target="_blank"><img src="images/instagram.svg" alt="instagram"></a>
                <a href="https://www.dribbble.com" target="_blank"><img src="images/dribbble icon.svg" alt="dribbble"></a>
                <a href="https://www.twitter.com" target="_blank"><img src="images/twitter.svg" alt="twitter"></a>
                <a href="https://www.youtube.com/@eightdev" target="_blank"><img src="images/youtube.svg" alt="youtube"></a>
            </label>
        </div>
            <div class="footer-links">
                <h4>Company</h4>
                <ul>
                    <li><a href="#">About us</a></li>
                    <li><a href="#">Blog</a></li>
                    <li><a href="#">Contact us</a></li>
                    <li><a href="#">Pricing</a></li>
                    <li><a href="#">Testimonials</a></li>
                </ul>
            </div>
            <div class="footer-links">
                <h4>Support</h4>
                <ul>
                    <li><a href="#">Help center</a></li>
                    <li><a href="#">Terms of service</a></li>
                    <li><a href="#">Legal</a></li>
                    <li><a href="#">Privacy policy</a></li>
                    <li><a href="#">Status</a></li>
                </ul>
            </div>
            <div class="footer-email">
                <h4>Stay up to date</h4>
                <form action="#">
                    <input type="email" placeholder="Your email address">
                    <button type="submit"><img src="images/send.svg" alt="Subscribe"></button>
                </form>

            </div>       

        </div>
    </footer>
</body>
</html>
